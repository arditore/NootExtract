name: CI

# The suite was developed on Windows, where the Unix-only symlink tests are
# compiled out and the cross-platform claim in the documentation cannot be
# checked. Running the same jobs on Linux and macOS is what makes that claim
# verifiable rather than assumed.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version && cargo --version

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      # Exercises the release binary end to end and cross-checks the result with
      # the independent Python validator and with coreutils sha256sum.
      - name: End-to-end workflow
        shell: bash
        run: bash scripts/e2e-check.sh

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Verifies the `rust-version` declared in Cargo.toml instead of trusting
      # it. The floor is set by let chains, stabilized in 1.88 on edition 2024.
      - name: Install the declared minimum toolchain
        shell: bash
        run: |
          msrv="$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"
          echo "declared MSRV: $msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          rustup default "$msrv"
          rustc --version

      - name: Build and test on the declared minimum
        run: cargo test --all-features

  no-default-features:
    name: default feature set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        shell: bash
        run: rustup update stable --no-self-update && rustup default stable

      # The scripted ADB stand-in must never be required for a normal build, and
      # must never be part of a release binary.
      - name: Build and test without test-support
        run: |
          cargo build --release
          cargo test

      - name: Confirm the test stand-in is absent from a default build
        shell: bash
        run: |
          if [ -e target/release/nootextract-fake-adb ]; then
            echo "the scripted ADB stand-in must not be built by default" >&2
            exit 1
          fi
          echo "default release build contains only the nootextract binary"
