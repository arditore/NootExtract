[package]
name = "nootextract"
version = "0.1.0"
edition = "2024"
# Let chains (`if let ... && ...`) require 1.88 on edition 2024.
rust-version = "1.88"
description = "Acquisition and evidence-preparation tool for authorized Android digital-forensics workflows"
license = "MIT"
readme = "README.md"
keywords = ["forensics", "android", "acquisition", "evidence", "adb"]
categories = ["command-line-utilities"]

[dependencies]
# CLI parsing and help/version generation.
clap = { version = "4.6.7", features = ["derive"] }
# Manifest and JSON output serialization.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Typed, non-panicking error model mapped onto the documented exit codes.
thiserror = "2.0.20"
# SHA-256 / SHA-512 streaming digests.
sha2 = "0.11.0"
# RFC 3339 UTC timestamps for the manifest and event log.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
# Structured logging (human-readable to stderr, JSON Lines to the case log).
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# Operator-facing progress reporting for long acquisitions.
indicatif = "0.18.6"
# SIGINT / Ctrl-C handling so an interrupted acquisition ends deterministically.
ctrlc = "3.5.2"
# Free-space interrogation of the destination filesystem (pre-acquisition check).
fs4 = "1.1.0"

[features]
# Builds the scripted ADB stand-in used by the integration tests. Off by
# default so it is never part of a release build.
test-support = []

[[bin]]
name = "nootextract"
path = "src/main.rs"

[[bin]]
name = "nootextract-fake-adb"
path = "src/bin/fake_adb.rs"
required-features = ["test-support"]

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Deny constructs that can abort mid-acquisition or silently corrupt sizes.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
integer_division = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "allow"
# The product name is not a code identifier, so it needs no backticks.
doc_markdown = "allow"
# CLI flag structs are naturally boolean-heavy; grouping them would obscure the
# one-flag-one-field mapping that clap relies on.
struct_excessive_bools = "allow"
# Command handlers are linear orchestration; splitting them purely to satisfy a
# line count would add indirection without adding clarity.
too_many_lines = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
